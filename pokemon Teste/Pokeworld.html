<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PokeWorld</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo-left">
        <i class="fas fa-circle-notch"></i>
      </div>
      <img src="Poke World.png" alt="Pokémon Logo" class="logo-center" />
      <div class="logo-right"></div>
    </header>

    <!-- CONTAINER -->
    <main class="container">
      <!-- Barra de busca -->
      <div class="search-bar">
        <button class="filter-btn"><i class="fas fa-filter"></i> Filter</button>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="Pesquisar Pokémon..."
          />
        </div>
        <button class="elements-btn">
          Elements <i class="far fa-smile"></i>
        </button>
      </div>

      <div class="StatusPokemon">
        <div id="modal" class="modal">
          <div class="modal-conteudo">
            <span class="fechar" onclick="fecharModal()">&times;</span>
            <h2 id="name"></h2>
            <p id="type"></p>
            <p id="id"></p>
          </div>
        </div>
      </div>

      <!-- Lista de Pokémon -->
      <section class="pokemon-list" id="pokemon-list">
        <!-- Renderizado via JS -->
      </section>
      <!--Exibir status pelo modal-->
      <div class="StatusPokemon">
        <div id="modal" class="modal">
          <div class="modal-conteudo">
            <span class="fechar" onclick="fecharModal()">&times;</span>
            <h2 id="name"></h2>
            <p id="type"></p>
            <p id="id"></p>
          </div>
        </div>
      </div>
      <div class="buttonLogin">
        <h4><a href="Tela de login1.html">Login</a></h4>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
